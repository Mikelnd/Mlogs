<!DOCTYPE html>
<html>
<head>
  <title>Join WhatsApp Group</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }

    .container {
      padding: 60px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 20px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #bbb;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🔥 Join My Private WhatsApp Group</h1>
    <p>Limited slots available. Don’t miss out!</p>

    <button class="btn" onclick="joinNow()">👉 Join Now</button>

    <div class="note">
      If it doesn't open, tap the 3 dots and select "Open in browser"
    </div>
  </div>

  <script>
    function joinNow() {
      window.location.href = "https://chat.whatsapp.com/I0g2RQon3Op599kYlsWy4h?mode=gi_t";
    }
  </script>

</body>
</html>
